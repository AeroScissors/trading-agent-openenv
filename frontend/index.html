<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trading-Agent-OpenEnv</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.3/cdn.min.js" defer></script>
</head>
<body>
  <div class="dash" x-data="dashboard()" x-init="init()">

    <div class="header">
      <div>
        <div class="logo">TRADING AGENT DASHBOARD</div>
        <div class="sublogo">MULTI-ASSET PORTFOLIO · RISK-ADJUSTED PERFORMANCE</div>
      </div>
      <div class="status-wrap" :class="{ offline: !apiOnline }">
        <span class="dot" :class="apiOnline ? 'dot-green' : 'dot-red'"></span>
        <span x-text="apiOnline ? 'API ONLINE' : 'API OFFLINE'"></span>
      </div>
    </div>

    <div class="score-row">
      <template x-for="t in tasks" :key="t.id">
        <div
          class="score-card"
          :class="[t.id, activeTask === t.id ? 'active-card' : '']"
          @click="switchTask(t.id)"
        >
          <div class="task-label" x-text="t.label"></div>
          <div class="score-val" x-text="t.score !== null ? t.score.toFixed(4) : '—'"></div>
          <div class="meta-row">
            <span class="profit" x-text="t.profit !== null ? '+$' + t.profit.toLocaleString() : '—'"></span>
            <span x-text="t.steps !== null ? t.steps + ' steps' : '—'"></span>
          </div>
        </div>
      </template>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <div class="chart-title">PORTFOLIO VALUE</div>
        <div class="chart-hint">SCROLL TO ZOOM · DRAG TO PAN · DOUBLE-CLICK TO RESET</div>
        <div class="task-tabs">
          <template x-for="t in tasks" :key="t.id">
            <button
              class="tab"
              :class="[t.id + '-tab', activeTask === t.id ? 'active' : '']"
              @click="switchTask(t.id)"
              x-text="t.id.toUpperCase()"
            ></button>
          </template>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="priceChart"></canvas>
      </div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:#00ffe7;box-shadow:0 0 4px #00ffe7"></div>PORTFOLIO VALUE</div>
      </div>
    </div>

    <div class="bottom-row">

      <div class="avg-card">
        <div class="avg-label">AVERAGE SHARPE</div>
        <div class="avg-val" x-text="avgScore !== null ? avgScore.toFixed(4) : '—'"></div>
        <div class="avg-sub">ACROSS 3 TASKS · LAST RUN</div>

        <template x-for="t in tasks" :key="t.id">
          <div style="margin-bottom:10px">
            <div class="bar-label">
              <span
                :style="'color:' + (t.id==='easy' ? 'var(--cyan)' : t.id==='medium' ? 'var(--amber)' : 'var(--magenta)')"
                x-text="t.id.toUpperCase()"
              ></span>
              <span x-text="t.score !== null ? t.score.toFixed(2) : '—'"></span>
            </div>

            <div class="bar-track">
              <div class="bar-grid">
                <template x-for="(seg, index) in segments" :key="index">
                  <div
                    class="seg"
                    :style="segmentStyle(t, index)"
                  ></div>
                </template>
              </div>
            </div>

          </div>
        </template>
      </div>

      <div class="feed">
        <div class="feed-title">PORTFOLIO ALLOCATION</div>

        <div class="portfolio-table">
          <template x-if="currentAllocation.length === 0">
            <div class="feed-empty">
              No allocation yet. Run the agent.
            </div>
          </template>
          <template x-if="currentAllocation.length > 0">
            <div>
              <template x-for="item in currentAllocation" :key="item.symbol">
                <div class="alloc-row">
                  <span class="alloc-symbol" x-text="item.symbol"></span>
                  <div class="alloc-bar-wrap">
                    <div class="alloc-bar" :style="'width:' + (item.weight * 100) + '%'"></div>
                  </div>
                  <span class="alloc-pct" x-text="(item.weight * 100).toFixed(1) + '%'"></span>
                </div>
              </template>
            </div>
          </template>
        </div>

        <div class="run-controls">
          <select
            x-model="activeTask"
            class="task-select"
            :disabled="running"
            @change="switchTask(activeTask)"
          >
            <option value="easy">EASY (3 assets)</option>
            <option value="medium">MEDIUM (5 assets)</option>
            <option value="hard">HARD (7 assets)</option>
          </select>
          <button class="run-btn" @click="runAgent()" :disabled="running">
            <span x-text="running ? 'RUNNING...' : 'RUN AGENT'"></span>
          </button>
        </div>

        <div class="progress-wrap" x-show="running || progress > 0">
          <div class="progress-bar" :style="'width:' + progress + '%'"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/dashboard.js"></script>

  <script>
    const _orig = dashboard;
    dashboard = function() {
      const d = _orig();

      d.TOTAL_SEGMENTS = 30;

      Object.defineProperty(d, 'segments', {
        get() {
          return Array.from({ length: d.TOTAL_SEGMENTS });
        }
      });

      d.segmentStyle = function(task, index) {
        if (task.score === null) return '';

        const normalized = Math.max(0, Math.min(1, task.score));
        const filled = Math.floor(normalized * d.TOTAL_SEGMENTS);

        if (index < filled) {
          let color;

          if (task.id === 'easy') color = 'var(--cyan)';
          else if (task.id === 'medium') color = 'var(--amber)';
          else color = 'var(--magenta)';

          return `background:${color}; box-shadow:0 0 4px ${color};`;
        }

        return 'background:transparent;';
      };

      return d;
    };
  </script>
</body>
</html>
