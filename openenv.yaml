name: trading-agent-openenv
version: "2.0.0"
description: >
  Multi-asset portfolio management environment for reinforcement learning.
  Agents allocate capital across diversified portfolios and are evaluated
  on risk-adjusted returns (Sharpe ratio) rather than raw profit.

author: AeroScissors
license: MIT

# ------------------------------------------------------------------ #
#  Tasks                                                               #
# ------------------------------------------------------------------ #

tasks:
  - id: easy
    name: Balanced Portfolio (3 Assets)
    description: >
      Manage a 3-asset portfolio of large-cap tech stocks.
      Equal-weight baseline provides ~0.95 Sharpe on clean uptrend data.
    assets: [AAPL, MSFT, GOOGL]
    difficulty: easy
    initial_cash: 10000.0
    sharpe_target: 1.0
    data_period: 2020-2024

  - id: medium
    name: Mixed Sectors (5 Assets)
    description: >
      Diversified 5-asset portfolio spanning tech, healthcare, and finance.
      Lower correlation between assets requires strategic rebalancing.
    assets: [AAPL, MSFT, GOOGL, JNJ, JPM]
    difficulty: medium
    initial_cash: 10000.0
    sharpe_target: 0.9
    data_period: 2020-2024

  - id: hard
    name: Stocks + Crypto (7 Assets)
    description: >
      7-asset portfolio including high-volatility crypto (BTC, ETH).
      Requires risk-parity allocation to balance stable stocks with
      volatile crypto assets for optimal Sharpe ratio.
    assets: [AAPL, MSFT, GOOGL, JNJ, JPM, BTC-USD, ETH-USD]
    difficulty: hard
    initial_cash: 10000.0
    sharpe_target: 1.2
    data_period: 2020-2024
    notes: >
      Crypto assets trade 24/7 with higher volatility. Risk-adjusted
      allocation is critical to avoid portfolio blow-up.

# ------------------------------------------------------------------ #
#  State Space                                                         #
# ------------------------------------------------------------------ #

state_space:
  step:
    type: int
    description: Current timestep index
  prices:
    type: dict
    description: Current prices per asset {symbol: price}
    example: {"AAPL": 180.5, "MSFT": 320.2, "GOOGL": 140.8}
  portfolio_value:
    type: float
    description: Total portfolio value (assets + cash)
  weights:
    type: dict
    description: Current portfolio allocation {symbol: weight}
    example: {"AAPL": 0.33, "MSFT": 0.33, "GOOGL": 0.34}
  cash_fraction:
    type: float
    range: [0.0, 1.0]
    description: Fraction of portfolio held in cash

# ------------------------------------------------------------------ #
#  Action Space                                                        #
# ------------------------------------------------------------------ #

action_space:
  weights:
    type: dict
    description: Target portfolio allocation {symbol: weight}
    constraints:
      - All weights must be non-negative
      - Sum of weights must be ≤ 1.0 (remaining is cash)
      - Auto-normalized if sum > 1.0
    example: {"AAPL": 0.4, "MSFT": 0.3, "GOOGL": 0.3}

# ------------------------------------------------------------------ #
#  Reward                                                              #
# ------------------------------------------------------------------ #

reward:
  metric: sharpe_ratio
  formula: annualized_sharpe = (mean_returns / std_returns) * sqrt(252)
  range: [-5.0, 5.0]
  clipped: true
  description: >
    Sharpe ratio is computed at episode end from portfolio value history.
    Higher Sharpe = better risk-adjusted returns. Clipped to [-5, 5] to
    handle extreme volatility in crypto-heavy portfolios.

# ------------------------------------------------------------------ #
#  Grader                                                              #
# ------------------------------------------------------------------ #

grader:
  endpoint: POST /grader
  output: 
    portfolio_value: float
    sharpe: float
  description: >
    Returns final portfolio value and annualized Sharpe ratio.
    Sharpe is the primary evaluation metric for ranking agents.

# ------------------------------------------------------------------ #
#  API Endpoints                                                       #
# ------------------------------------------------------------------ #

api:
  base_url: http://localhost:7860
  endpoints:
    - method: GET
      path: /tasks
      description: List all tasks with metadata
    - method: POST
      path: /reset
      description: Reset environment, returns initial state
      body:
        task: string (optional, defaults to "easy")
    - method: GET
      path: /state
      description: Get current state snapshot
      params:
        task: string (optional)
    - method: POST
      path: /step
      description: Execute portfolio rebalancing action
      body:
        task: string
        weights: dict
    - method: POST
      path: /grader
      description: Return final Sharpe and portfolio value
      body:
        task: string

# ------------------------------------------------------------------ #
#  Runtime                                                             #
# ------------------------------------------------------------------ #

runtime:
  port: 7860
  framework: FastAPI
  python: "3.11"
  docker: true
  huggingface_spaces: true
  frontend: true
  frontend_path: /

# ------------------------------------------------------------------ #
#  Data                                                                #
# ------------------------------------------------------------------ #

data:
  source: yfinance
  period: 2020-01-01 to 2024-12-31
  frequency: daily
  assets:
    AAPL: Apple Inc. (tech)
    MSFT: Microsoft Corp. (tech)
    GOOGL: Alphabet Inc. (tech)
    JNJ: Johnson & Johnson (healthcare)
    JPM: JPMorgan Chase (finance)
    BTC-USD: Bitcoin (crypto)
    ETH-USD: Ethereum (crypto)
  preprocessing:
    - Forward-fill missing values
    - Drop rows with NaN after ffill
    - Align indices across all assets

# ------------------------------------------------------------------ #
#  Baseline                                                            #
# ------------------------------------------------------------------ #

baseline:
  easy: 
    strategy: Equal-weight (33.3% per asset)
    expected_sharpe: ~0.95
  medium:
    strategy: Equal-weight (20% per asset)
    expected_sharpe: ~0.91
  hard:
    strategy: Risk-parity (stocks 80%, crypto 20%)
    expected_sharpe: ~1.27
  notes: >
    Simple equal-weight or risk-adjusted baselines provide strong
    performance on uptrending 2020-2024 data. Advanced strategies
    (momentum, minimum variance) may improve further.